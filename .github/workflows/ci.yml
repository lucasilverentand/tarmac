name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-26

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4
        with:
          install_args: tuist

      - name: Cache Tuist and DerivedData
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            ~/.tuist
            DerivedData
          key: ${{ runner.os }}-tuist-${{ hashFiles('Project.swift', 'Tuist.swift') }}
          restore-keys: |
            ${{ runner.os }}-tuist-

      - name: Generate project
        run: tuist generate --no-open

      - name: Build
        run: |
          xcodebuild build \
            -scheme Tarmac \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_SWIFT_FLAGS='$(inherited) -warnings-as-errors' \
          | xcpretty

      - name: Test
        run: |
          xcodebuild test \
            -scheme Tarmac \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
          | xcpretty

      - name: Coverage summary
        if: always()
        continue-on-error: true
        run: |
          bundle="TestResults.xcresult"
          if [ ! -d "$bundle" ]; then
            echo "No test result bundle; skipping coverage."
            exit 0
          fi
          if [ -z "$(find "$bundle" -name '*.xccovreport' -print -quit 2>/dev/null)" ]; then
            echo "No coverage report in bundle; skipping coverage summary."
            exit 0
          fi
          if ! xcrun xccov view --report --json "$bundle" > coverage.json 2>/dev/null; then
            echo "xccov could not load coverage; skipping."
            exit 0
          fi
          echo "### Code Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          xcrun xccov view --report "$bundle" 2>/dev/null | head -30 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
